services:
  postgres:
    image: postgres:alpine
    container_name: warehouse-postgres
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "55432:5432"
    volumes:
      - warehouse-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  warehouse-pgdata:
