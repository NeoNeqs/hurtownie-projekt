services:
  postgres:
    image: postgres:alpine
    container_name: warehouse-postgres
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      # Loopback only: on a cloud VM the database must not be reachable from
      # the internet. Use an SSH tunnel when you need remote access.
      - "127.0.0.1:55432:5432"
    volumes:
      - warehouse-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  warehouse-pgdata:
